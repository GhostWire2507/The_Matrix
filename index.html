<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cakes Inside Cups</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="matrixCanvas"></canvas>

  <!-- 🌸 Mood Selection -->
  <div id="moodContainer" class="center-container">
    <h2 class="center-text">How are you feeling today?</h2>
    <button class="mood-btn" data-mood="sad">Feeling Sad</button>
    <button class="mood-btn" data-mood="overwhelmed">Feeling Overwhelmed</button>
    <button class="mood-btn" data-mood="confidence">Confidence Low</button>
  </div>

  <!-- 💬 Main Affirmation Section -->
  <div id="mainContainer" class="center-container hidden">
    <div class="center-text" id="affirmation"></div>
    <div class="button-group">
      <button id="refreshBtn">✨ Refresh ✨</button>
      <button id="backBtn" class="back-btn">⬅ Back to Moods</button>
    </div>
  </div>

  <!-- 🎵 Background Music -->
  <audio id="bgMusic" src="song.mp3" preload="auto"></audio>

  <!-- 🤫 Secret Button -->
  <button id="secretBtn" class="secret-btn hidden">!</button>

  <!-- 💔 Secret Notes Modal -->
  <div id="secretModal" class="secret-modal hidden">
    <div class="secret-card">
      <button class="secret-close-btn">&times;</button>
      <div class="secret-note" id="secretNote"></div>
      <div class="secret-progress" id="secretProgress"></div>
      <div class="secret-button-group">
        <button id="secretPrevBtn" class="secret-nav-btn">← Previous</button>
        <button id="secretNextBtn" class="secret-nav-btn">Next →</button>
      </div>
    </div>
  </div>

  <!-- 🎵 Secret Music -->
  <audio id="secretMusic" src="song2.m4a" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
